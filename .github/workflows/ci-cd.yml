# À chaque push sur main : build des images api-auth et api-catalogue et push sur ghcr.io
name: ci-cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api: [api-auth, api-catalogue, api-user]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.api }}
          push: true
          tags: |
            ghcr.io/loic-only-one/videotheque-${{ matrix.api }}:${{ github.sha }}
            ghcr.io/loic-only-one/videotheque-${{ matrix.api }}:latest
